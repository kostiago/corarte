<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="titulo-pagina">Peça — Corarte</title>
<meta name="description" id="descricao-pagina" content="Camisa pintada à mão pelo ateliê Corarte." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<svg class="textura" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="ruido">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="100%" height="100%" filter="url(#ruido)" />
</svg>

<div id="cabecalho-app"></div>

<nav class="trilha" aria-label="Você está aqui" id="trilha"></nav>

<div id="produto-conteudo"></div>

<section class="vitrine" id="relacionados-secao" hidden>
  <div class="vitrine__cabecalho">
    <h2>Você também pode gostar</h2>
  </div>
  <div class="grade" id="grade-relacionados"></div>
</section>

<div id="rodape-app"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox__fechar" aria-label="Fechar imagem em tela cheia">×</button>
  <div class="lightbox__conteudo" id="lightbox-conteudo"></div>
</div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/pagina-produto.js"></script>
</body>
</html>
